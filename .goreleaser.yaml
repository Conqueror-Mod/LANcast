# Release build for LANcast (ADR 0016, ADR 0080). A pushed vX.Y.Z tag builds
# the one LANcast executable for the matrix and publishes a GitHub release. No CGO, so
# every target cross-compiles on one Linux runner; the committed internal/web/dist
# is what the server embeds, so no npm at release time.
version: 2

# Builds are split by OS rather than filtered with `ignore`, because the archives
# below have to differ: only the Windows one carries WebView2Loader.dll, and a
# goreleaser archive can select builds but cannot pick files per-OS. Four small
# blocks that each say one thing beat two blocks plus a file rule that silently
# does the wrong thing — the first attempt used a glob expected to match nothing
# off Windows, and goreleaser treats a glob with no matches as a hard error.
builds:
  # One LANcast executable (ADR 0080): the desktop app and the server in one
  # file. `LANcast.exe` opens the window and its tray; `LANcast.exe service`,
  # `serve`, `reset-auth` and the rest are the server. Both version variables
  # are injected, because both halves report one: the page compares the
  # window's with the server's, and /api/health reports the server's.
  - id: lancast-windows
    main: ./cmd/lancast
    binary: LANcast
    env: [CGO_ENABLED=0]
    goos: [windows]
    # Windows is amd64-only for now (ADR 0016).
    goarch: [amd64]
    # The GUI subsystem is what stops a double-click showing a console; the
    # icon comes from the committed cmd/lancast/lancast_windows.syso.
    # The provider keys (ADR 0110) come from repository secrets, like the
    # report webhook: a key in a public repository is scraped within hours.
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X lancast/internal/api.Version={{ .Version }} -X lancast/internal/report.WebhookURL={{ index .Env "LANCAST_REPORT_WEBHOOK" }} -X lancast/internal/config.BuiltinTMDBKey={{ index .Env "LANCAST_TMDB_KEY" }} -X lancast/internal/config.BuiltinOpenSubtitlesKey={{ index .Env "LANCAST_OPENSUBTITLES_KEY" }} -H=windowsgui

  # Headless on Linux: `lancast serve` is what systemd runs.
  - id: lancast-unix
    main: ./cmd/lancast
    binary: lancast
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X lancast/internal/api.Version={{ .Version }} -X lancast/internal/report.WebhookURL={{ index .Env "LANCAST_REPORT_WEBHOOK" }} -X lancast/internal/config.BuiltinTMDBKey={{ index .Env "LANCAST_TMDB_KEY" }} -X lancast/internal/config.BuiltinOpenSubtitlesKey={{ index .Env "LANCAST_OPENSUBTITLES_KEY" }}

  # ---- lancast-faces (ADR 0052) --------------------------------------------
  #
  # The only cgo in this repository, and the reason it is a separate binary.
  # Every block above is CGO_ENABLED=0 and cross-compiled from one Linux
  # runner; enabling cgo inside lancastd would drag a mingw toolchain, an
  # aarch64 toolchain and a glibc floor into every release. Here the cost is
  # paid by one optional artefact for the platforms it can actually serve.
  #
  # amd64 only, deliberately. linux/arm64 needs an aarch64 cross-compiler and
  # a vision library built for it; a face worker nobody has asked for on a Pi
  # is not worth holding a release for, and it can be added when it is.
  - id: lancast-faces-windows
    main: ./cmd/lancast-faces
    binary: lancast-faces
    env:
      - CGO_ENABLED=1
      # The mingw cross-compiler, installed by the release workflow. Named
      # rather than left to the default: with CGO_ENABLED=1 and no CC, Go
      # reaches for the host gcc and silently builds a Linux object for a
      # Windows target, which fails at link time with a message about
      # architecture that reads like a Go bug.
      - CC=x86_64-w64-mingw32-gcc
    goos: [windows]
    goarch: [amd64]
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  - id: lancast-faces-linux
    main: ./cmd/lancast-faces
    binary: lancast-faces
    env: [CGO_ENABLED=1]
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w -X main.Version={{ .Version }}

# Split by OS for what goes *in* each archive; the name is shared, and below.
archives:
  # LANcast_…, not lancast_…, and the capital is load-bearing (ADR 0080 §5,
  # amended): updaters from before the single executable look for lancast_…
  # and keep only the file names they know, so under the old name they would
  # stage the two DLLs alone and offer the same update for ever. Under this
  # one they stop and say so, and the release notes send people to the
  # installer. internal/update/download.go archiveName must agree.
  - id: windows
    ids: [lancast-windows]
    name_template: "LANcast_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    files:
      - README.md
      - LICENSE
    # NOTICE carries the attribution Apache-2.0 asks of the Go dependencies,
    # and COMMERCIAL.md is the offer NOTICE points at — shipping NOTICE
    # without it leaves a dangling reference in the archive somebody actually
    # downloaded. Both were added to the faces archives when those were
    # written and never backfilled here, so every release from v0.8.45 (the
    # AGPL move, ADR 0053) to v0.8.51 shipped the licence without the
    # attribution that accompanies it.
      - NOTICE
      - COMMERCIAL.md
      # Microsoft's WebView2 loader shim, which the client's window mode calls
      # into (ADR 0023 stage 1). It has to sit beside LANcast.exe.
      #
      # The installer places it too. It is here as well so unpacking the
      # portable zip is not a quietly worse install than running the setup —
      # the client would fall back to the browser and report an incomplete
      # install, which would be true and confusing.
      - src: third_party/webview2/x64/WebView2Loader.dll
        dst: WebView2Loader.dll

      # libmpv, the desktop client's player (ADR 0067/0069). The release
      # workflow fetches it and checks its hash before this runs; it is not in
      # git. Beside it goes its licence, because the LGPL asks that the terms
      # travel with the binary.
      - src: third_party/libmpv/out/libmpv-2.dll
        dst: libmpv-2.dll
      - src: third_party/libmpv/LICENSE.LGPL
        dst: libmpv-LICENSE.txt

  - id: unix
    ids: [lancast-unix]
    name_template: "LANcast_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - COMMERCIAL.md

  # lancast-faces gets its own archives, one per platform.
  #
  # It was folded into the two archives above on the reasoning that goreleaser
  # would be content for an archive to hold a build that does not cover every
  # platform in its matrix. It is not, and it says so: the unix tarballs would
  # have carried three binaries on amd64 and two on arm64, and goreleaser
  # refuses that outright — "archive has different count of binaries for each
  # platform, which may cause your users confusion." It is right, and the
  # comment asserting otherwise was a guess written as a fact.
  #
  # Its own archive is the better answer anyway, and the one ADR 0052 should
  # have reached first. The worker is optional: somebody with no picture
  # library has no reason to download it, and a separate artefact is what
  # "optional" looks like on a releases page. It also lets the worker ship for
  # the platforms it can serve without implying the server is missing from the
  # ones it cannot.
  - id: faces-windows
    ids: [lancast-faces-windows]
    name_template: "lancast-faces_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    files: [README.md, LICENSE, NOTICE, COMMERCIAL.md]

  - id: faces-linux
    ids: [lancast-faces-linux]
    name_template: "lancast-faces_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [README.md, LICENSE, NOTICE, COMMERCIAL.md]

checksum:
  name_template: "checksums.txt"

# One signature over the checksum list covers the whole release: match an
# artifact against its digest in a signed list and the artifact is as good as
# signed. This is what makes automatic installation defensible — a checksum
# alone proves the bytes arrived intact, not that the project produced them,
# because it is served from the same place as the download.
#
# The key is Ed25519, held only as the RELEASE_SIGNING_KEY secret, and separate
# from the plugin project key (ADR 0021) so a compromise of one is not a
# compromise of both.
#
# The paths are substituted into the script itself rather than passed as
# positional arguments. A standalone "${artifact}" argument arrives at the shell
# as an empty string — the placeholder is expanded where it appears inside an
# argument, not when it is the whole of one — so `-in "$0"` signed nothing and
# the first tag carrying this block failed at the signing step. Verified by
# printing the real argv from a snapshot run rather than by reading the docs.
#
# Missing key is a hard failure, not a quiet downgrade. The secret is set, and a
# signature is what makes an update installable rather than merely offered; a
# release that silently published unsigned would be discovered by users whose
# updater declines to install it. Verification still accepts unsigned releases —
# that is about the ones already published, not about producing new ones.
signs:
  - id: checksums
    artifacts: checksum
    cmd: sh
    args:
      - "-c"
      - 'test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY is not set; refusing to publish an unsigned release" >&2; exit 1; }; go run ./cmd/lcsign sign -in "${artifact}" -out "${signature}"'
    signature: "${artifact}.sig"

# Draft so the maintainer eyeballs the notes and artifacts before publishing.
release:
  draft: true

changelog:
  disable: true
