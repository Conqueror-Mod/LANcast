name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref, so a fresh push doesn't queue behind
# a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # build before test: the embed of internal/web/dist must compile, and a
      # broken build is a clearer failure than a test that can't link.
      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci
        working-directory: web

      - name: type-check + build
        run: npm run build
        working-directory: web

      # Runs after the build so a type error is reported as a type error rather
      # than as a pile of failing tests. The suite is jsdom-only and takes a
      # couple of seconds; nothing here needs a browser or a media file.
      - name: test
        run: npm test
        working-directory: web

      # The committed internal/web/dist is what the Go binary embeds. If a client
      # change was committed without rebuilding it, a fresh build here differs —
      # the exact drift that shipped a stale UI once (#10).
      #
      # Checked against the hashed assets, not index.html: Vite fingerprints the
      # bundle by content, so any source change yields new asset filenames and a
      # diff here. index.html is a generated pointer to those hashes, and its
      # line endings are platform-dependent (Windows build vs Linux CI), so
      # comparing it byte-for-byte is fragile; the assets are the real signal.
      - name: embedded bundle is in sync with source
        run: |
          if ! git diff --quiet -- internal/web/dist/assets; then
            echo "internal/web/dist is out of sync with web/ source."
            echo "Run 'npm run build' in web/ and commit the regenerated internal/web/dist."
            git diff --stat -- internal/web/dist
            exit 1
          fi

  # The installer is only built on a tag, so until now nothing checked it until a
  # release was already being cut. That is how a shortcut shipped carrying the
  # literal text "$%ProgramData%\LANcast": the script compiled cleanly and simply
  # produced the wrong string. A compile here will not catch a wrong-but-valid
  # value, but it does catch the whole class above it — undefined variables,
  # renamed constants, syntax — at PR time rather than mid-release.
  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install nsis
        run: sudo apt-get update && sudo apt-get install -y nsis

      # makensis needs the two executables and the WebView2 loader to exist; the
      # real ones come from goreleaser at release time, so stand in placeholders.
      # This checks the script, not the payload.
      - name: stage placeholders
        run: |
          : > installer/LANcast-Server.exe
          : > installer/LANcast-Client.exe

      # -WX turns warnings into errors. An undefined $VARIABLE is a warning in
      # NSIS and would otherwise compile straight into a shipped installer.
      - name: compile the installer script
        run: makensis -WX -DVERSION=0.0.0-ci installer/lancast.nsi
