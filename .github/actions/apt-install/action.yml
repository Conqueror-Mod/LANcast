name: apt-install
description: >
  Install apt packages through .github/scripts/apt-install.sh, with the
  downloaded .debs kept in the Actions cache.

# Why the cache: a runner fetches from azure.archive.ubuntu.com, which is
# normally 90 MB/s and on a bad day 250 KB/s. The script now survives a slow
# mirror, but surviving is not the same as not waiting — the mingw toolchain at
# that rate is several minutes of a pull request doing nothing. With the .debs
# restored from the cache, apt fetches nothing on the common path and the
# mirror's mood only matters when a package version changes.
#
# The key is the package list and the runner image. The image is rebuilt about
# weekly, and a new one misses, restores last week's .debs through the prefix,
# downloads whatever changed, and saves again. Correctness never depends on
# any of it: apt checks each .deb against the signed indexes, and a cache that
# is empty, stale or gone costs a download and nothing else.
#
# A tag build (release.yml) can read caches saved by main, so a release takes
# the same fast path as a pull request.

inputs:
  packages:
    description: Space-separated package names.
    required: true

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        pkgs="$(echo "$PACKAGES" | tr -s ' ' '+')"
        echo "prefix=apt-${pkgs}-${ImageOS:-unknown}-" >> "$GITHUB_OUTPUT"
        echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "dir=${RUNNER_TEMP}/apt-archives" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        # .debs only: apt keeps a root-owned lock file and a partial/ directory
        # beside them, and neither belongs in a cache.
        path: ${{ steps.key.outputs.dir }}/*.deb
        key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.image }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - shell: bash
      env:
        APT_ARCHIVES: ${{ steps.key.outputs.dir }}
        PACKAGES: ${{ inputs.packages }}
      # $PACKAGES unquoted on purpose: it is a list.
      run: |
        "${GITHUB_ACTION_PATH}/../../scripts/apt-install.sh" $PACKAGES
